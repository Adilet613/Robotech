<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Робототехника Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="register">
        <h1>Добро пожаловать в мир робототехники!</h1>
        <form id="registrationForm">
            <label>Имя:</label><br>
            <input type="text" id="username" required><br><br>

            <label>Пароль:</label><br>
            <input type="password" id="password" required><br><br>

            <button type="submit">Зарегистрироваться</button>
        </form>
    </div>

    <div class="container hidden" id="chooseKit">
        <h2>Выберите набор:</h2>
        <select id="kitSelector">
            <option value="ev3">LEGO EV3</option>
            <option value="spike">SPIKE Prime</option>
        </select><br><br>
        <button onclick="showParts()">Продолжить</button>
    </div>

    <div class="container hidden" id="enterParts">
        <h2>Введите количество деталей:</h2>

        <label>Количество ультразвуковых датчиков:</label>
        <input type="number" id="ultrasonic" min="0"><br><br>

        <label>Количество датчиков света/цвета:</label>
        <input type="number" id="color" min="0"><br><br>

        <label>Количество гироскопов / датчиков наклона:</label>
        <input type="number" id="gyro" min="0"><br><br>

        <label>Количество моторов:</label>
        <input type="number" id="motors" min="0"><br><br>

        <button onclick="suggestRobots()">Предложить роботов</button>
    </div>

    <div class="container hidden" id="result">
        <h2>Варианты роботов, которые вы можете собрать:</h2>
        <ul id="robotList"></ul>
        <button onclick="goBack()">Назад</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
